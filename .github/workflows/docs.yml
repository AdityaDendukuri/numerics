name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the GitHub UI

permissions:
  contents: write      # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install libclang mkdocs-material

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNUMERICS_BUILD_TESTS=OFF \
            -DNUMERICS_BUILD_BENCHMARKS=OFF \
            -DNUMERICS_BUILD_DOCS=ON

      - name: Build docs
        run: cmake --build build --target docs

      - name: Check documentation links
        run: |
          missing=0
          for page in \
            index.html \
            reference/index.html \
            reference/kernel/index.html \
            reference/concepts/index.html \
            reference/examples/index.html \
            .nojekyll; do
            if [ ! -f "build/docs/site/${page}" ]; then
              echo "::error file=${page}::MkDocs did not generate ${page}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/site
          publish_branch: gh-pages
          force_orphan: true        # keeps gh-pages history clean
