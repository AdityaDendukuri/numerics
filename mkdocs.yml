site_name: numerics
site_description: A C++20 library for scientific computing
repo_url: https://github.com/AdityaDendukuri/numerics
docs_dir: docs
site_dir: build/site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  # The colours come from the theme file under extra_css below.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Examples: reference/examples/index.md
  - Reference:
      - Containers: reference/containers.md
      - Concepts: reference/concepts.md
      - Kernels: reference/kernel.md
      - Linear algebra: reference/linear_algebra.md
      - ODEs: reference/odes.md
      - PDEs and fields: reference/pdes_and_fields.md
      - Spectral: reference/spectral_transforms.md
      - Quadrature and roots: reference/quadrature_and_roots.md
      - Statistics and sampling: reference/statistics.md
      - Data structures: reference/data_structures.md
      - Algorithms: reference/algorithms.md
      - All names: reference/index.md
  - Benchmark report: report/REPORT.md

# docs/indexes holds the sources refdoc turns into the grouped indexes.
exclude_docs: |
  indexes/
  CMakeLists.txt

# Links every mention of a public name to its reference page; see tools/autolink.py.
hooks:
  - tools/autolink.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - assets/numerics.css
  # Colour theme, one of three-bands, purple-lead or cardinal-lead.
  - assets/themes/three-bands.css
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  reference/**
