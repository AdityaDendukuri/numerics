site_name: numerics
site_description: A C++20 library for scientific computing
repo_url: https://github.com/AdityaDendukuri/numerics
docs_dir: docs
site_dir: build/site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts, laws and diagnostics: concepts.md
  - Architecture: architecture.md
  - Backends: backends.md
  - num::kernel: kernel.md
  - Performance: performance.md
  - Algorithm notes: notes.md
  - Reference:
      - reference/index.md
      - All containers: reference/containers.md
      - All kernels: reference/kernel.md
      - All concepts: reference/concepts.md
      - Examples: reference/examples/index.md
  - Benchmark report: report/REPORT.md

# docs/indexes holds the sources refdoc turns into the grouped indexes.
exclude_docs: |
  indexes/
  CMakeLists.txt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - assets/numerics.css
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  reference/**
