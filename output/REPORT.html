(function(){
  var md = "# Numerics Library — Status Report\n\n> 2026-08-22 23:44 UTC · AppleClang 17.0.0.17000013 · Release\n\nAuto-generated by `make report`. Each section compares our implementation against the\nindustry-standard LAPACK\/BLAS reference. Sections without data show `[not available]`.\n\n---\n\n## Table of Contents\n\n- [Build Environment](#build-environment)\n- [Test Summary](#test-summary)\n- [Core — Vector and Matrix](#core--vector-and-matrix)\n  - [Benchmarks — Matrix Multiply](#benchmarks--matrix-multiply)\n  - [Benchmarks — Matrix-Vector Multiply](#benchmarks--matrix-vector-multiply)\n  - [Benchmarks — Dot Product](#benchmarks--dot-product)\n  - [Benchmarks — Axpy](#benchmarks--axpy)\n- [Factorizations](#factorizations)\n  - [LU Factorization](#lu-factorization)\n  - [QR Factorization](#qr-factorization)\n  - [Thomas Tridiagonal Solver](#thomas-tridiagonal-solver)\n- [Iterative Solvers](#iterative-solvers)\n  - [Conjugate Gradient](#conjugate-gradient)\n  - [Convergence Dynamics](#convergence-dynamics)\n- [Resolvent & Matrix Exponential](#resolvent--matrix-exponential)\n  - [Talbot Spectral Quadrature](#talbot-spectral-quadrature)\n- [Banded Matrices](#banded-matrices)\n- [Eigensolvers](#eigensolvers)\n  - [Full Symmetric Eigensolver](#full-symmetric-eigensolver)\n  - [Lanczos (Matrix-Free)](#lanczos-matrix-free)\n- [Singular Value Decomposition](#singular-value-decomposition)\n  - [Full SVD](#full-svd)\n  - [Randomized Truncated SVD](#randomized-truncated-svd)\n- [Dynamical Systems & Symplectic ODEs](#dynamical-systems--symplectic-odes)\n  - [Hamiltonian Energy Conservation](#hamiltonian-energy-conservation)\n- [Analysis](#analysis)\n- [Spectral — FFT](#spectral--fft)\n\n---\n\n## Build Environment\n\n### System\n\n| Property | Value |\n|----------|-------|\n| OS       | macOS |\n| CPU      | 8 core Apple M1 Pro |\n| RAM      | 16384 MB (16.0 GB) |\n| GPU      | n\/a |\n\n\n### Backends\n\n| Backend | Status | Notes |\n|---------|--------|-------|\n| BLAS  | 0.0 ms |\n| LU | 9 | 9 | 0 | 0.0 ms |\n| QR | 7 | 7 | 0 | 0.0 ms |\n| Roots | 9 | 9 | 0 | 0.0 ms |\n| Quadrature | 11 | 11 | 0 | 1.0 ms |\n| FFT | 13 | 13 | 0 | 3.0 ms |\n| FFTPlan | 4 | 4 | 0 | 1.0 ms |\n| ODE_Euler | 1 | 1 | 0 | 0.0 ms |\n| ODE_RK4 | 2 | 2 | 0 | 0.0 ms |\n| ODE_RK45 | 2 | 2 | 0 | 0.0 ms |\n| ODE_Stepper | 2 | 2 | 0 | 0.0 ms |\n| ODE_Verlet | 4 | 4 | 0 | 1.0 ms |\n| ODE_Yoshida4 | 3 | 3 | 0 | 0.0 ms |\n| EigSym_Jacobi | 3 | 3 | 0 | 0.0 ms |\n| EigSym_LAPACK | 3 | 3 | 0 | 1.0 ms |\n| PowerIteration | 1 | 1 | 0 | 0.0 ms |\n| Lanczos | 2 | 2 | 0 | 1.0 ms |\n| SVD_Jacobi | 3 | 3 | 0 | 0.0 ms |\n| SVD_LAPACK | 4 | 4 | 0 | 1.0 ms |\n| SVD_Randomized | 2 | 2 | 0 | 0.0 ms |\n| ScalarField3D | 1 | 1 | 0 | 0.0 ms |\n| VectorField3D | 1 | 1 | 0 | 0.0 ms |\n| FieldSolver | 2 | 2 | 0 | 0.0 ms |\n| Solve | 2 | 2 | 0 | 0.0 ms |\n| Sample | 1 | 1 | 0 | 0.0 ms |\n| Umbrella | 1 | 1 | 0 | 0.0 ms |\n| DebugCheck | 5 | 5 | 0 | 0.0 ms |\n| DisjointSet | 4 | 4 | 0 | 1.0 ms |\n| IndexedPriorityQueue | 4 | 4 | 0 | 0.0 ms |\n| Graph | 7 | 7 | 0 | 0.0 ms |\n\n\n---\n\n## Core — Vector and Matrix\n\n`Vector` and `Matrix` dispatch to the backend selected via the `Backend` enum\n(`seq → blocked → simd → blas → omp → gpu`). With BLAS available, `default_backend`\nresolves to `Backend::blas`.\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| Vector | 7 | 7 | 0 | 0.0 ms |\n| Matrix | 7 | 7 | 0 | 0.0 ms |\n\n\n### Benchmarks — Matrix Multiply\n\nThroughput: `2 n³ \/ time` (GFLOP\/s, higher is better). Sizes n = 64…512.\n\n![Matrix multiply: GFLOP\/s vs n](plots\/matmul.png)\n\n\n| Variant | n=64 us | n=128 us | n=256 us | n=512 us |\n|---------|---------|----------|----------|----------|\n| naive | 160.5 | 1835.0 | 18117.1 | 161909.2 |\n| blocked (auto-vec) | 32.4 | 263.4 | 2765.0 | 24749.0 |\n| reg-blocked | 138.8 | 1125.0 | 9408.5 | 77245.1 |\n| blocked | 32.4 | 264.2 | 2796.1 | 24781.9 |\n| simd | 19.4 | 155.2 | 1354.0 | 11633.7 |\n| blas | 2.0 | 13.5 | 102.1 | 442.6 |\n| omp | 50.2 | 127.7 | 584.2 | 4301.8 |\n| Matmul_Scalar | 140.1 | 1586.8 | 15353.8 | 152967.9 |\n| Matmul_Scalar_Blocked | 93.4 | 736.3 | 5983.4 | 47777.2 |\n\n*Time in us. Lower is better.*\n\n\n### Benchmarks — Matrix-Vector Multiply\n\nMemory-bound. GB\/s = `(n² + 2n) × 8 \/ time`.\n\n*Plot not available (backend absent or benchmarks not run).*\n\n\n| Variant | n=64 GB\/s | n=128 GB\/s | n=256 GB\/s | n=512 GB\/s | n=1024 GB\/s | n=2048 GB\/s |\n|---------|-----------|------------|------------|------------|-------------|-------------|\n| seq | 23.07 | 16.20 | 15.30 | 11.05 | 9.65 | 9.04 |\n| blocked | 23.29 | 16.22 | 15.13 | 10.83 | 9.50 | 9.03 |\n| simd | 38.91 | 28.32 | 21.66 | 18.20 | 15.02 | 13.75 |\n| blas | 97.09 | 138.61 | 154.72 | 161.56 | 104.36 | 30.11 |\n| omp | 2.34 | 8.66 | 26.94 | 50.97 | 63.06 | 65.87 |\n\n*Throughput in GB\/s. Higher is better.*\n\n\n### Benchmarks — Dot Product\n\n*Plot not available (backend absent or benchmarks not run).*\n\n\n| Variant | n=1024 GB\/s | n=4096 GB\/s | n=16384 GB\/s | n=65536 GB\/s | n=262144 GB\/s | n=1048576 GB\/s |\n|---------|-------------|-------------|--------------|--------------|---------------|----------------|\n| seq | 18.84 | 17.41 | 17.11 | 17.04 | 16.96 | 16.86 |\n| blas | 117.05 | 104.30 | 82.10 | 82.49 | 80.97 | 62.41 |\n| omp | 0.63 | 2.36 | 8.69 | 27.58 | 66.93 | 102.74 |\n\n*Throughput in GB\/s. Higher is better.*\n\n\n### Benchmarks — Axpy (y += a·x)\n\n*Plot not available (backend absent or benchmarks not run).*\n\n\n| Variant | n=1024 GB\/s | n=4096 GB\/s | n=16384 GB\/s | n=65536 GB\/s | n=262144 GB\/s | n=1048576 GB\/s |\n|---------|-------------|-------------|--------------|--------------|---------------|----------------|\n| seq | 190.04 | 195.65 | 104.65 | 101.91 | 103.43 | 88.96 |\n| blas | 194.19 | 223.00 | 228.84 | 232.60 | 230.44 | 85.87 |\n| omp | 1.88 | 7.02 | 25.09 | 67.76 | 145.66 | 184.10 |\n\n*Throughput in GB\/s. Higher is better.*\n\n\n---\n\n## Factorizations\n\nThree variants benchmarked side-by-side: **our seq**, **our omp**, **LAPACK**\n(`LAPACKE_dgetrf` \/ `LAPACKE_dgeqrf`). With LAPACK available, `lu()` and `qr()`\ndefault to `Backend::lapack`.\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| Thomas | 3 | 3 | 0 | 0.0 ms |\n| LU | 9 | 9 | 0 | 0.0 ms |\n| QR | 7 | 7 | 0 | 0.0 ms |\n\n\n### LU Factorization\n\nLAPACK uses a blocked algorithm (BLAS-3 trailing-matrix updates via `dgemm`) that is\nsignificantly faster than our unblocked Doolittle for large n.\n\n*Plot not available (backend absent or benchmarks not run).*\n\n\n| Variant | n=64 us | n=128 us | n=256 us | n=512 us | n=1024 us |\n|---------|---------|----------|----------|----------|-----------|\n| seq | 17.5 | 123.8 | 1338.8 | 11208.6 | 83374.6 |\n| omp | 17.0 | 128.7 | 1369.2 | 11124.2 | 83914.5 |\n| LU<Backend::lapack> | 48.7 | 323.8 | 2360.9 | 17813.3 | 133797.7 |\n\n*GFLOP\/s: 2\/3 n^3 \/ time. Higher is better.*\n\n\n### QR Factorization\n\nLAPACK (`dgeqrf` + `dorgqr`) uses blocked Householder with `dgemm` for panel updates.\n\n*Plot not available (backend absent or benchmarks not run).*\n\n\n| Variant | n=64 us | n=128 us | n=256 us | n=512 us |\n|---------|---------|----------|----------|----------|\n| seq | 241.6 | 2241.5 | 39864.9 | 509775.3 |\n| omp | 242.3 | 2257.0 | 40052.0 | 511626.0 |\n| QR<Backend::lapack> | 173.4 | 1683.9 | 14678.7 | 133690.1 |\n\n*GFLOP\/s: 4\/3 n^3 \/ time. Higher is better.*\n\n\n### Thomas Tridiagonal Solver\n\nO(n) direct solver. `LAPACKE_dgtsv` uses the same algorithm with additional\npivoting for stability.\n\n![Thomas algorithm: time vs n](plots\/thomas.png)\n\n\n| Variant | n=64 us | n=256 us | n=1024 us | n=4096 us | n=16384 us | n=65536 us |\n|---------|---------|----------|-----------|-----------|------------|------------|\n| Thomas | 1.2 | 4.5 | 16.7 | 66.3 | 285.7 | 1065.6 |\n\n*Time in us. Linear O(n) scaling expected.*\n\n\n---\n\n## Iterative Solvers\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| CG | 5 | 5 | 0 | 0.0 ms |\n| GaussSeidel | 3 | 3 | 0 | 2.0 ms |\n| Jacobi | 3 | 3 | 0 | 0.0 ms |\n\n\n### Conjugate Gradient\n\nCG inner-product and axpy calls dispatch to `best_backend` (BLAS when available).\n\n![Conjugate gradient: time vs n](plots\/cg.png)\n\n\n| Variant | n=32 us | n=64 us | n=128 us | n=256 us |\n|---------|---------|---------|----------|----------|\n| CG | 2.1 | 3.9 | 9.1 | 25.3 |\n\n*Time in us. Lower is better.*\n\n\n### Convergence Dynamics\n\nRelative residual reduction $\\frac{\\|r_k\\|}{\\|b\\|}$ across iterations on 2D Poisson ($N = 1024$ nodes):\n\n![Iterative Solvers Convergence](plots\/iterative_convergence.png)\n\n---\n\n## Resolvent & Matrix Exponential\n\n### Talbot Spectral Quadrature\n\nEvaluation of matrix exponential action $e^{t Q} p_0$ via Weideman-Talbot shifted resolvent contour solves $(s_k I - Q)^{-1} p_0$ accelerated by Upper Hessenberg reduction ($O(N^3 + k N^2)$):\n\n![Talbot Quadrature Convergence](plots\/talbot_convergence.png)\n\n---\n\n## Banded Matrices\n\n### Tests\n\n*No test data -- run `make report` to generate.*\n\n\n### Benchmarks\n\n![Banded solver: time vs n](plots\/banded.png)\n\n\n| Variant | n=3 us | n=5 us | n=7 us | n=11 us | n=15 us | n=21 us | n=64 us | n=256 us | n=1024 us | n=4096 us | n=16384 us | n=65536 us | n=262144 us |\n|---------|--------|--------|--------|---------|---------|---------|---------|----------|-----------|-----------|------------|------------|-------------|\n| BandedSolve_Tridiagonal | -- | -- | -- | -- | -- | -- | 2.1 | 6.6 | 23.3 | 92.1 | 395.3 | 1598.6 | 6774.2 |\n| BandedSolve_Pentadiagonal | -- | -- | -- | -- | -- | -- | 2.5 | 7.8 | 29.9 | 116.5 | 473.2 | 2011.4 | -- |\n| BandedSolve_General_KL2_KU4 | -- | -- | -- | -- | -- | -- | 2.6 | 8.2 | 31.1 | 120.4 | 474.3 | 2038.7 | -- |\n| BandedSolve_General_KL5_KU5 | -- | -- | -- | -- | -- | -- | 3.6 | 12.3 | 48.0 | 185.1 | 824.3 | -- | -- |\n| BandedLU_Factorization | -- | -- | -- | -- | -- | -- | 1.4 | 3.8 | 13.4 | 51.6 | 204.9 | 830.8 | -- |\n| BandedLU_Solve | -- | -- | -- | -- | -- | -- | 1.6 | 4.3 | 15.2 | 58.9 | 233.4 | 933.5 | -- |\n| BandedSolve_MultiRHS | -- | -- | -- | -- | -- | -- | 15.3 | 58.8 | 229.1 | 916.2 | 3687.8 | -- | -- |\n| BandedMatvec_Tridiagonal | -- | -- | -- | -- | -- | -- | 0.4 | 1.4 | 34.0 | 41.3 | 64.6 | 139.4 | 392.2 |\n| BandedMatvec_Pentadiagonal | -- | -- | -- | -- | -- | -- | 0.6 | 2.1 | 35.1 | 40.0 | 72.1 | 176.4 | 546.0 |\n| BandedSolve_Bandwidth_Scaling | 95.9 | 123.6 | 145.2 | 209.1 | 298.8 | 486.8 | -- | -- | -- | -- | -- | -- | -- |\n\n*Time in us. Lower is better.*\n\n\n---\n\n## Eigensolvers\n\nThree variants: **our cyclic Jacobi (seq)**, **our Jacobi (omp)**, **LAPACK `dsyevd`**\n(divide-and-conquer, asymptotically fastest for dense matrices).\nLanczos is matrix-free and targets only k eigenvalues — it lives on a separate plot.\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| PowerIteration | 1 | 1 | 0 | 0.0 ms |\n| Lanczos | 2 | 2 | 0 | 1.0 ms |\n\n\n### Full Symmetric Eigensolver\n\n![Symmetric eigensolver: time vs n](plots\/eigen.png)\n\n\n| Variant | n=32 us | n=64 us | n=128 us | n=256 us | n=512 us |\n|---------|---------|---------|----------|----------|----------|\n| seq | 174.4 | 1018.0 | 15585.1 | 259460.6 | 4867239.0 |\n| EigSym<Backend::lapack> | 33.6 | 258.0 | 2029.9 | 16662.4 | 135271.0 |\n\n*Time in us. Lower is better.*\n\n\n### Lanczos (Matrix-Free)\n\nk = 10 eigenvalues requested. Each step costs one matvec O(n²) plus reorthogonalisation.\n\n| Variant | n=64 us | n=128 us | n=256 us | n=512 us | n=1024 us | n=2048 us |\n|---------|---------|----------|----------|----------|-----------|-----------|\n| Lanczos | 33.5 | 103.4 | 261.2 | 784.7 | 2796.2 | 40311.8 |\n\n*Time in us (k=10 eigenvalues). Lower is better.*\n\n\n---\n\n## Singular Value Decomposition\n\nThree variants: **our one-sided Jacobi**, **randomized truncated SVD** (top k = n\/8),\n**LAPACK `dgesdd`** (divide-and-conquer, fastest full SVD).\n\n### Tests\n\n*No test data -- run `make report` to generate.*\n\n\n### Full SVD\n\n![SVD: time vs n](plots\/svd.png)\n\n\n*No benchmark data -- run `make report` to generate.*\n\n\n### Randomized Truncated SVD\n\n| Variant | n=64 us | n=128 us | n=256 us | n=512 us | n=1024 us |\n|---------|---------|----------|----------|----------|-----------|\n| SVD_Randomized | 239.3 | 1462.1 | 22735.1 | 212677.0 | 1647578.5 |\n\n*Time in us (k=n\/8 singular values). Lower is better.*\n\n\n---\n\n## Dynamical Systems & Symplectic ODEs\n\n### Hamiltonian Energy Conservation\n\nLong-term energy error $|E(t) - E(0)|$ over $2 \\times 10^3$ steps ($h = 0.05$):\n\n![Symplectic Energy Preservation](plots\/symplectic_energy.png)\n\n---\n\n## Analysis\n\nRoot finding (bisection, Newton, secant) and numerical quadrature\n(Gauss-Legendre, adaptive Simpson).\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| Roots | 9 | 9 | 0 | 0.0 ms |\n| Quadrature | 11 | 11 | 0 | 1.0 ms |\n\n\n---\n\n## Spectral — FFT\n\nBackends: `seq` (Cooley-Tukey), `simd` (AVX2\/NEON), `fftw` (FFTW3).\n\n### Tests\n\n| Suite | Tests | Passed | Failed | Time |\n|-------|------:|-------:|-------:|-----:|\n| FFT | 13 | 13 | 0 | 3.0 ms |\n| FFTPlan | 4 | 4 | 0 | 1.0 ms |\n\n\n### Benchmarks — Forward FFT\n\n![FFT throughput: GB\/s vs n](plots\/fft.png)\n\n\n| Variant | n=256 GB\/s | n=1024 GB\/s | n=4096 GB\/s | n=16384 GB\/s | n=65536 GB\/s | n=262144 GB\/s | n=1048576 GB\/s |\n|---------|------------|-------------|-------------|--------------|--------------|---------------|----------------|\n| seq (Cooley-Tukey) | 4.14 | 3.45 | 2.92 | 2.31 | 2.03 | 1.69 | -- |\n| simd (AVX2\/NEON) | 5.00 | 4.17 | 3.54 | 2.89 | 2.54 | 2.18 | -- |\n| fftw (FFTW3) | 16.21 | 12.74 | 10.20 | 3.95 | 3.93 | 3.45 | 1.51 |\n\n*Throughput in GB\/s. Higher is better.*\n\n\n### Benchmarks — FFT Plan (amortised)\n\n![FFT plan throughput: GB\/s vs n](plots\/fft_plan.png)\n\n\n| Variant | n=256 GB\/s | n=1024 GB\/s | n=4096 GB\/s | n=16384 GB\/s | n=65536 GB\/s | n=262144 GB\/s | n=1048576 GB\/s |\n|---------|------------|-------------|-------------|--------------|--------------|---------------|----------------|\n| seq (Cooley-Tukey) | 4.14 | 3.45 | 2.92 | 2.31 | 2.03 | 1.69 | -- |\n| simd (AVX2\/NEON) | 5.00 | 4.17 | 3.54 | 2.89 | 2.54 | 2.18 | -- |\n| fftw (FFTW3) | 16.21 | 12.74 | 10.20 | 3.95 | 3.93 | 3.45 | 1.51 |\n\n*Throughput in GB\/s. Plan creation excluded. Higher is better.*\n\n\n### Benchmarks — Real-to-Complex FFT\n\n![rFFT throughput: GB\/s vs n](plots\/rfft.png)\n\n\n| Variant | n=256 GB\/s | n=1024 GB\/s | n=4096 GB\/s | n=16384 GB\/s | n=65536 GB\/s | n=262144 GB\/s | n=1048576 GB\/s |\n|---------|------------|-------------|-------------|--------------|--------------|---------------|----------------|\n| seq (Cooley-Tukey) | 1.18 | 0.92 | 0.78 | 0.65 | 0.55 | 0.47 | -- |\n| simd (AVX2\/NEON) | 1.42 | 1.36 | 1.24 | 0.97 | 0.94 | 0.76 | -- |\n| fftw (FFTW3) | 0.45 | 1.15 | 1.83 | 1.83 | 1.52 | 1.42 | 1.45 |\n\n*Throughput in GB\/s. Higher is better.*\n\n\n---\n\n*Generated by `make report`.*\n";
  var html = marked.parse(md);
  // Inject id attributes into headings so TOC anchor links work.
